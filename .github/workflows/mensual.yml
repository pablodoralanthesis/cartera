name: Compra mensual
on:
  schedule:
    - cron: "0 9 2 * *"   # dia 2 de cada mes, 09:00 UTC
  workflow_dispatch:       # tambien se puede lanzar a mano
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit si hay cambios
        run: |
          if ! git diff --quiet; then
            git config user.name "cartera-bot"
            git config user.email "cartera-bot@users.noreply.github.com"
            git commit -am "Compra mensual $(date -u +%Y-%m)"
            git push
          fi
